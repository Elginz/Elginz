<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Elgin Foo - AI and Cloud Engineer in the making">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <style>
      .title { font: 700 64px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e8d5b7; animation: fadeUp 1.4s ease-out both; }
      .sub   { font: 400 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8baf9f; letter-spacing: 2px; animation: fadeUp 1.4s ease-out 0.5s both; }
      .wave1 { animation: drift 9s ease-in-out infinite alternate; }
      .wave2 { animation: drift 13s ease-in-out infinite alternate-reverse; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes drift  { from { transform: translateX(-40px); } to { transform: translateX(40px); } }
    </style>
  </defs>
  <rect width="1000" height="220" fill="url(#bg)"/>
  <g class="wave1" opacity="0.18">
    <path d="M-100 170 C 100 130, 250 210, 450 170 S 800 130, 1100 170 L1100 220 L-100 220 Z" fill="#8baf9f"/>
  </g>
  <g class="wave2" opacity="0.12">
    <path d="M-100 190 C 150 160, 300 220, 520 190 S 850 160, 1100 190 L1100 220 L-100 220 Z" fill="#e8d5b7"/>
  </g>
  <text x="500" y="100" text-anchor="middle" class="title">Elgin Foo</text>
  <text x="500" y="145" text-anchor="middle" class="sub">AI &amp; CLOUD ENGINEER-IN-THE-MAKING</text>
</svg>
